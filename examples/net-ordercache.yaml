  '/api/v1/order/{orderNo}/tasks/history':
    get:
      tags:
        - EXTERNAL
      summary: 'Get Task history for all tasks on a specific order as a map with ''{taskId}'':[task history list]'
      description: 'Get Task history for all tasks on a specific order as a map with ''{taskId}'':[task history list]'
      operationId: getTaskHistoryByOrder
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of historic order states
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/TaskDTO'
        '400':
          description: Bad Request
          content:
            application/json:
