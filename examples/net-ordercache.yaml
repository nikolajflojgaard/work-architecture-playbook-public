openapi: 3.0.1
info:
  title: net-ordercache
  description: Order cache where clients can search for orders and get history on orders and tasks
  version: '1.0'
servers:
  - url: https://api-sit-global.tdcnet.dk/net-ordercache
paths:
  '/api/v1/task/{id}/history':
    get:
      tags:
        - EXTERNAL
      summary: Get Task history
      description: Get Task history
      operationId: getTaskHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of historic order states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDTO'
              example:
                - id: 1
                  taskId: '3806'
                  taskName: Poi Tildeling
                  bookedDateSpecial: string
                  bookedDate: string
                  bookedTimeFrom: string
                  bookedTimeTo: string
                  executionDateSpecial: string
                  executionDate: string
                  executionTime: string
                  taskRescheduleAble: true
                  taskRescheduled: false
                  orderStage: SITE_SURVEY
                  delayed: false
                  additionalTaskDataList:
                    - string
                  createdDate: '2023-10-04T10:28:54.0000000+00:00'
                  createdBy: Someone
                  lastModifedDate: '2023-10-04T10:28:54.0000000+00:00'
                  lastModifedBy: Someone Else
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorPayload'
              example:
                timestamp: string
                status: string
                message: string
                path: string
                code: string
                reason: string
                statusCode: string
                statusError: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorPayload'
              example:
                timestamp: string
                status: string
                message: string
                path: string
                code: string
                reason: string
                statusCode: string
                statusError: string
