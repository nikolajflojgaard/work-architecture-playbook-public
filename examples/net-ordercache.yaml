  /api/v1/order/search:
    get:
      tags:
        - EXTERNAL
      summary: Search for orders
      description: Search for orders
      operationId: searchOrders
      parameters:
        - name: lid
          in: query
          schema:
            type: string
        - name: orderNo
          in: query
          schema:
            type: integer
        - name: orderState
          in: query
          schema:
            enum:
              - GREEN
              - YELLOW
              - RED
            type: string
        - name: orderStage
          in: query
          schema:
            enum:
              - PREPARE_FIBER
              - SITE_SURVEY
              - OFFER
              - ORDER_CONFIRMATION
              - HIGH_LEVEL_DESIGN
              - DETAILED_DESIGN
              - FIBER_CONSULTANT
              - DIGGING
              - PROVISIONING
              - CENTRAL_CONNECT
              - CUSTOMER_INSTALLATION
              - GIG_TECHNICIAN
              - GDS_WITHOUT_TECHNICIAN
              - GDS_WITH_TECHNICIAN
              - IGNORE
              - EXECUTED
              - FINISHED
              - CANCELLED
            type: string
        - name: statusList
          in: query
          schema:
            type: array
            items:
              enum:
                - STARTED
                - ORDERED
                - EXECUTED
                - INVOICED
                - CANCELLED
              type: string
        - name: falloutType
          in: query
          schema:
            enum:
              - INTERNAL
              - EXTERNAL
              - ANY
            type: string
        - name: pageable
